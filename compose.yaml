name: hoodlink

x-api-environment: &api-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-hoodlink}:${POSTGRES_PASSWORD:-hoodlink_local}@db:5432/${POSTGRES_DB:-hoodlink}
  NODE_ENV: ${API_NODE_ENV:-development}
  HOST: 0.0.0.0
  PORT: 4000
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  SESSION_SECRET: ${SESSION_SECRET:-hoodlink-local-development-secret-change-before-deploying}
  BOT_TOKEN: ${BOT_TOKEN:-}
  BOT_USERNAME: ${BOT_USERNAME:-}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
  SUPER_ADMIN_TELEGRAM_IDS: ${SUPER_ADMIN_TELEGRAM_IDS:-}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  ELITE_STARS: ${ELITE_STARS:-250}
  TERMS_URL: ${TERMS_URL:-}
  SUPPORT_URL: ${SUPPORT_URL:-}
  ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-true}
  ALLOW_DEMO_ROLE_SWITCH: ${ALLOW_DEMO_ROLE_SWITCH:-true}
  DATABASE_POOL_SIZE: 10

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoodlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoodlink_local}
      POSTGRES_DB: ${POSTGRES_DB:-hoodlink}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hoodlink-api:local
    environment:
      <<: *api-environment
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: [sh, -c, "node dist/database/migrate.js && if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then node dist/database/seed.js; fi"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hoodlink-api:local
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    image: hoodlink-web:local
    environment:
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data: